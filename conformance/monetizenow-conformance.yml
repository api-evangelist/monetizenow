- id: gdpr
  conforms: claimed
  evidence: >-
    Processor role, documented DSAR workflow and sub-processor erasure
    propagation per the Information Security Policy; DPA published at
    https://www.monetizenow.ai/legal/data-processing-addendum.
- id: pci-dss
  conforms: false
  evidence: >-
    Not claimed. Card data collection is delegated to Stripe; MonetizeNow stores
