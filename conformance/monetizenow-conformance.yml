generated: '2026-08-13'
method: searched
source: >-
  MonetizeNow's published OpenAPI 3.0.3 (openapi/monetizenow-openapi.json),
  https://www.monetizenow.ai/information-security-policy,
  https://mcp.monetizeplatform.com/.well-known/oauth-authorization-server,
  https://mcp.monetizeplatform.com/.well-known/oauth-protected-resource,
  and live TLS/DNS probes.
description: >-
  Which cross-cutting and industry standards the MonetizeNow surface actually
  conforms to, judged from artifacts in this repo and live probes. The picture is
  split: the REST API is a plain key-authenticated OpenAPI 3.0 surface with no
  RFC 9457 errors and no scopes, while the (undocumented) MCP server implements
  the modern OAuth discovery stack correctly.
standards:
- id: openapi-3.0
  conforms: true
  evidence: >-
    MonetizeNow publishes OpenAPI 3.0.3 fragments per operation inside its ReadMe
    reference; merged into openapi/monetizenow-openapi.json.
- id: openapi-3.1
  conforms: false
  evidence: Published documents declare openapi 3.0.3.
- id: apikey-auth
  conforms: true
  evidence: x-api-key header authentication documented at reference/getting-started-with-your-api
- id: oauth2
  conforms: true
  evidence: >-
    Authorization Code + PKCE S256 with refresh tokens, protecting
    https://mcp.monetizeplatform.com/mcp. NOT used by the REST API.
- id: rfc8414-oauth-authorization-server-metadata
  conforms: true
  evidence: 'https://mcp.monetizeplatform.com/.well-known/oauth-authorization-server returns 200 application/json'
- id: rfc9728-oauth-protected-resource-metadata
  conforms: true
  evidence: 'https://mcp.monetizeplatform.com/.well-known/oauth-protected-resource returns 200 application/json'
- id: rfc7591-dynamic-client-registration
  conforms: true
  evidence: 'registration_endpoint https://mcp.monetizeplatform.com/oauth/register advertised in RFC 8414 metadata'
- id: rfc7636-pkce
  conforms: true
  evidence: 'code_challenge_methods_supported: [S256]'
- id: mcp
  conforms: true
  evidence: >-
    Live JSON-RPC MCP endpoint at https://mcp.monetizeplatform.com/mcp; returns a
    JSON-RPC/OAuth challenge rather than a tool list without a bearer token.
- id: oidc
  conforms: false
  evidence: '/.well-known/openid-configuration returns 404 on every host including the MCP host.'
- id: rfc9116-security-txt
  conforms: false
  evidence: >-
    No /.well-known/security.txt on any host. A responsible-disclosure contact is
    published only as prose on the Information Security Policy page.
- id: rfc9457-problem-details
  conforms: false
  evidence: >-
    No application/problem+json media type appears in any published response.
    Errors are documented as an HTTP status table (400/404/409/500) plus a
    string error-code enum on the self-service checkout API.
- id: rfc9331-ratelimit-headers
  conforms: false
  evidence: No RateLimit-* or X-RateLimit-* headers are documented; no 429 is documented.
- id: rfc8594-sunset-header
  conforms: false
  evidence: >-
    A deprecation policy exists (reference/api-breaking-change-policy) but relies
    on documentation, newsletters and email — no Sunset/Deprecation header.
- id: webhooks
  conforms: true
  evidence: >-
    Documented webhook event catalog (30 events) with a JSON envelope
    (eventId/userId/sentTime/eventType/data). No delivery signature is documented.
- id: asyncapi
  conforms: false
  evidence: No AsyncAPI document is published for the webhook surface.
- id: api-versioning-policy
  conforms: true
  evidence: version-header major versioning + documented breaking-change/deprecation policy
- id: pagination
  conforms: true
  evidence: >-
    Uniform currentPage / pageSize query parameters documented in the OpenAPI
    info.description and modelled as the MNPageable component schema.
- id: idempotency
  conforms: partial
  evidence: >-
    No Idempotency-Key header. Idempotent create/update is achieved through
    caller-supplied custom identifiers (*ByCustomId operations). See
