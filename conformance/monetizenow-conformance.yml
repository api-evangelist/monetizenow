- id: tls
  conforms: true
  evidence: TLSv1.3 on all hosts; HSTS on the web and docs hosts (see security/monetizenow-domain-security.yml)
- id: soc2-type-ii
  conforms: claimed-aligned
  evidence: >-
    "SOC 2 Type II-aligned control environment" per
    https://www.monetizenow.ai/information-security-policy; report available to
