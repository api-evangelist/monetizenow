          type: string
          example: addr_bkoY6dCoLRblllsJ
      - name: billday
        in: query
        schema:
          type: string
          example: '2022-04-07'
      - name: status
        in: query
        schema:
          type: string
          example: ACTIVE
      - name: type
        in: query
        schema:
          type: string
      - name: billingContactStatus
        in: query
