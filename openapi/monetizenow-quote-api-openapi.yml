        in: query
        schema:
          type: string
          example: usr_X0XZ05bvkrB1RpLS
      - name: owner
        in: query
        schema:
          type: string
          example: usr_X0XZ05bvkrB1RpLS
      - name: contractEndDate
        in: query
        schema:
