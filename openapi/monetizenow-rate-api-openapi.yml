          endDate: null
        prices:
        - createdBy: usr_9oKqG1KrGADCoPmg
          createDate: 2023-05-24T17:52:10.995+0000
          lastModifiedBy: usr_9oKqG1KrGADCoPmg
          modifyDate: 2023-05-24T17:52:10.995+0000
          id: pric_GH1cSjlWdU3LF
          from: 0
