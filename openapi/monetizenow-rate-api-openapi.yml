components:
  schemas:
    com.monytyz.billing.catalog.dto.price.RangeDto:
      type: object
      properties:
        min:
          type: integer
          format: int64
        max:
          type: integer
          format: int64
    com.monytyz.billing.catalog.dto.rate.RateOptionsDto:
      required:
      - priceDisplay
      - productOptions
      type: object
      properties:
        productOptions:
          type: array
          items:
            $ref: '#/components/schemas/com.monytyz.billing.catalog.dto.rate.ProductRateOptionsDto'
        priceDisplay:
          type:
          - string
          - 'null'
          enum:
          - PRODUCT
          - OFFERING
      description: Rate Options give us the capability to configure per product configuration
    com.monytyz.billing.catalog.dto.rate.RateCreateData:
      required:
      - prices
      - rateType
      type: object
      properties:
        prices:
          maxItems: 2147483647
          minItems: 1
          uniqueItems: true
          type: array
          items:
            $ref: '#/components/schemas/com.monytyz.billing.catalog.dto.price.PriceSaveDtoV2'
        rateType:
          type: string
      example:
        name: Monthly Premium
        description: Premium plan for monthly customers
        status: ACTIVE
        currency: USD
        billingFrequency: MONTHLY
        usageBillingFrequency: null
        rateType: CATALOG
        quotable: true
