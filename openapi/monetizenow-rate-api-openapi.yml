openapi: 3.2.0
info:
  title: OpenAPI definition Rate API
  version: v0
  description: '# About MonetizeNow


    MonetizeNow provides a Quoting, Billing, and Usage platform built for the B2B SaaS enterprise.'
servers:
- url: https://api.monetizeplatform.com
tags:
- name: Rate
  description: Rates allow you to add prices, pricing logic, currency details, and billing frequency to an offering
paths:
  /api/offerings/{offeringId}/rates:
    post:
      tags:
      - Rate
      summary: Create a rate for offering
      description: Creates a new Rate that you can use to define pricing and billing frequency for products.
      operationId: createRateForOffering
      parameters:
      - name: offeringId
        in: path
        required: true
        schema:
          type: string
          example: offer_FzQSTr9oPD1NXHcd
        example: offer_FzQSTr9oPD1NXHcd
      - name: x-api-key
        in: header
        description: x-api-key is an authentication or authorization token used in API requests to verify the identity and permissions of the client
        required: true
        schema:
          type: string
          example: TYQ1YzM3NWItZjQzMi00NDYwLTlmOWYtN2UwNzI5YzM2ZmV0
      requestBody:
        content:
          application/json:
            schema:
              oneOf:
              - $ref: '#/components/schemas/RateCreateDataAccount'
              - $ref: '#/components/schemas/RateCreateDataCatalog'
        required: true
      responses:
        '201':
          description: Create Object
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/com.monytyz.billing.catalog.dto.rate.RateDetailDto'
        '400':
          description: Bad Request
        '500':
          description: Internal server error. Please contact the support team.
    get:
      tags:
      - Rate
      summary: Get all the rates for an offering
      description: Get all the rate by providing offering Id
      operationId: getAllRatesByOfferingId
      parameters:
      - name: offeringId
        in: path
        required: true
        schema:
          type: string
          example: offer_FzQSTr9oPD1NXHcd
        example: offer_FzQSTr9oPD1NXHcd
      - name: id
        in: query
        schema:
          type: string
          example: rate_1p4Z5Upb9Yh4Z
      - name: name
        in: query
        schema:
          type: string
          example: Premium Rate
      - name: customId
        in: query
        schema:
          type: string
          example: cix-aXtf-mnw
      - name: startDate
        in: query
        schema:
          type: string
          example: '2022-02-01'
      - name: endDate
        in: query
        schema:
          type: string
          example: '2022-02-01'
      - name: productId
        in: query
        schema:
          type: string
          example: prod_hQqN4qlz6ZV4R221
      - name: accountId
        in: query
        schema:
          type: string
        example: acct_hXmqN4FtgzMKjR22
      - name: rateType
        in: query
        schema:
          type: string
          example: catalog
      - name: parentRateId
        in: query
        schema:
          type: string
          example: rate_JLVVON0OzUDX2
      - name: currency
        in: query
        schema:
          type: string
          example: USD
      - name: billingFrequency
        in: query
        schema:
          type: string
          example: MONTHLY
      - name: billingFrequencyInMonths
        in: query
        schema:
          type: number
          example: 12
      - name: subscriptionTiming
        in: query
        schema:
          type: string
          example: ADVANCE
      - name: usageBillingFrequency
        in: query
        schema:
          type: string
          example: MONTHLY
      - name: locked
        in: query
        schema:
          type: boolean
          example: true
      - name: status
        in: query
        schema:
          type: string
          example: ACTIVE
      - name: sort
        in: query
        schema:
          type: string
          example: name
      - name: currentPage
        in: query
        schema:
          type: number
          example: 1
      - name: pageSize
        in: query
        schema:
          type: number
          example: 20
      - name: createDate
        in: query
        schema:
          type: string
          example: 2023-07-28T06:01:22.684+0000
      - name: modifyDate
        in: query
        schema:
          type: string
          example: 2023-07-28T06:01:22.684+0000
      - name: x-api-key
        in: header
        description: x-api-key is an authentication or authorization token used in API requests to verify the identity and permissions of the client
        required: true
        schema:
          type: string
          example: TYQ1YzM3NWItZjQzMi00NDYwLTlmOWYtN2UwNzI5YzM2ZmV0
      responses:
        '200':
          description: 'Object list retrieved '
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/com.monytyz.billing.catalog.dto.rate.RateListDto'
        '400':
          description: Bad Request
        '500':
          description: Internal server error. Please contact the support team.
  /api/offerings/{offeringId}/rates/{rateId}:
    delete:
      tags:
      - Rate
      summary: Delete rate
      description: Delete rate by providing offering Id and rate Id. This cannot be done on locked rates.
      operationId: deleteRateByOfferingIdAndRateId
      parameters:
      - name: offeringId
        in: path
        required: true
        schema:
          type: string
          example: offer_FzQSTr9oPD1NXHcd
        example: offer_FzQSTr9oPD1NXHcd
      - name: rateId
        in: path
        required: true
        schema:
          type: string
          example: rate_1p4Z5Upb9Yh4Z
        example: rate_1p4Z5Upb9Yh4Z
      - name: x-api-key
        in: header
        description: x-api-key is an authentication or authorization token used in API requests to verify the identity and permissions of the client
        required: true
        schema:
          type: string
          example: TYQ1YzM3NWItZjQzMi00NDYwLTlmOWYtN2UwNzI5YzM2ZmV0
      responses:
        '200':
          description: Rate has been successfully deleted
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/com.monytyz.billing.common.dto.ResponseDto'
        '400':
          description: Bad Request
        '500':
          description: Internal server error. Please contact the support team.
    get:
      tags:
      - Rate
      summary: Get a rate object by providing offering and rate Id
      operationId: getRateByOfferingAndRateId
      parameters:
      - name: offeringId
        in: path
        required: true
        schema:
          type: string
          example: offer_FzQSTr9oPD1NXHcd
        example: offer_FzQSTr9oPD1NXHcd
      - name: rateId
        in: path
        required: true
        schema:
          type: string
          example: rate_1p4Z5Upb9Yh4Z
        example: rate_1p4Z5Upb9Yh4Z
      - name: x-api-key
        in: header
        description: x-api-key is an authentication or authorization token used in API requests to verify the identity and permissions of the client
        required: true
        schema:
          type: string
          example: TYQ1YzM3NWItZjQzMi00NDYwLTlmOWYtN2UwNzI5YzM2ZmV0
      responses:
        '200':
          description: Get object by id
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/com.monytyz.billing.catalog.dto.rate.RateDto'
        '400':
          description: Bad Request
        '404':
          description: Resource not found by Id
        '500':
          description: Internal server error. Please contact the support team.
    put:
      tags:
      - Rate
      summary: Update a rate for offering
      description: Update a rate for offering, some fields will be locked once a rate is in use.
      operationId: updateRateForOffering
      parameters:
      - name: offeringId
        in: path
        required: true
        schema:
          type: string
          example: offer_FzQSTr9oPD1NXHcd
        example: offer_FzQSTr9oPD1NXHcd
      - name: rateId
        in: path
        required: true
        schema:
          type: string
          example: rate_1p4Z5Upb9Yh4Z
        example: rate_1p4Z5Upb9Yh4Z
      - name: x-api-key
        in: header
        description: x-api-key is an authentication or authorization token used in API requests to verify the identity and permissions of the client
        required: true
        schema:
          type: string
          example: TYQ1YzM3NWItZjQzMi00NDYwLTlmOWYtN2UwNzI5YzM2ZmV0
      requestBody:
        content:
          application/json:
            schema:
              oneOf:
              - $ref: '#/components/schemas/com.monytyz.billing.catalog.dto.rate.RateUpdateData.Account'
              - $ref: '#/components/schemas/com.monytyz.billing.catalog.dto.rate.RateUpdateData.Catalog'
        required: true
      responses:
        '200':
          description: Update object by id
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/com.monytyz.billing.catalog.dto.rate.RateDetailDto'
        '400':
          description: Bad Request
        '500':
          description: Internal server error. Please contact the support team.
  /api/offerings/{offeringId}/rates/{rateId}/activate:
    put:
      tags:
      - Rate
      summary: Activate rate
      description: Activate rate by providing offering Id and rate Id
      operationId: activateRateByOfferingIdAndId
      parameters:
      - name: offeringId
        in: path
        required: true
        schema:
          type: string
          example: offer_FzQSTr9oPD1NXHcd
        example: offer_FzQSTr9oPD1NXHcd
      - name: rateId
        in: path
        required: true
        schema:
          type: string
          example: rate_1p4Z5Upb9Yh4Z
        example: rate_1p4Z5Upb9Yh4Z
      - name: x-api-key
        in: header
        description: x-api-key is an authentication or authorization token used in API requests to verify the identity and permissions of the client
        required: true
        schema:
          type: string
          example: TYQ1YzM3NWItZjQzMi00NDYwLTlmOWYtN2UwNzI5YzM2ZmV0
      responses:
        '200':
          description: Activating object by id
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/com.monytyz.billing.catalog.dto.rate.RateDto'
        '400':
          description: Bad Request
        '500':
          description: Internal server error. Please contact the support team.
  /api/offerings/{offeringId}/rates/{rateId}/cancel:
    put:
      tags:
      - Rate
      summary: Cancel rate
      description: Cancel rate by providing offering Id and rate Id
      operationId: cancelRateByOfferingIdAndId
      parameters:
      - name: offeringId
        in: path
        required: true
        schema:
          type: string
          example: offer_FzQSTr9oPD1NXHcd
        example: offer_FzQSTr9oPD1NXHcd
      - name: rateId
        in: path
        required: true
        schema:
          type: string
          example: rate_1p4Z5Upb9Yh4Z
        example: rate_1p4Z5Upb9Yh4Z
      - name: x-api-key
        in: header
        description: x-api-key is an authentication or authorization token used in API requests to verify the identity and permissions of the client
        required: true
        schema:
          type: string
          example: TYQ1YzM3NWItZjQzMi00NDYwLTlmOWYtN2UwNzI5YzM2ZmV0
      responses:
        '200':
          description: Rate has been successfully canceled
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/com.monytyz.billing.common.dto.ResponseDto'
        '400':
          description: Bad Request
        '500':
          description: Internal server error. Please contact the support team.
  /api/rates:
    get:
      tags:
      - Rate
      summary: Get all the rates
      description: Get all the rate as list
      operationId: getAllRates
      parameters:
      - name: id
        in: query
        schema:
          type: string
          example: rate_1p4Z5Upb9Yh4Z
      - name: name
        in: query
        schema:
          type: string
          example: Premium Rate
      - name: customId
        in: query
        schema:
          type: string
          example: cix-aXtf-mnw
      - name: startDate
        in: query
        schema:
          type: string
          example: '2022-02-01'
      - name: endDate
        in: query
        schema:
          type: string
          example: '2022-02-01'
      - name: offeringId
        in: query
        schema:
          type: string
          example: offer_FzQSTr9oPD1NXHcd
      - name: productId
        in: query
        schema:
          type: string
          example: prod_hQqN4qlz6ZV4R221
      - name: accountId
        in: query
        schema:
          type: string
        example: acct_hXmqN4FtgzMKjR22
      - name: accountSpecific
        in: query
        schema:
          type: string
          example: false
      - name: parentRateId
        in: query
        schema:
          type: string
          example: rate_JLVVON0OzUDX2
      - name: currency
        in: query
        schema:
          type: string
          example: USD
      - name: billingFrequency
        in: query
        schema:
          type: string
          example: MONTHLY
      - name: billingFrequencyInMonths
        in: query
        schema:
          type: number
          example: 12
      - name: subscriptionTiming
        in: query
        schema:
          type: string
          example: ADVANCE
      - name: usageBillingFrequency
        in: query
        schema:
          type: string
          example: MONTHLY
      - name: locked
        in: query
        schema:
          type: boolean
          example: true
      - name: status
        in: query
        schema:
          type: string
          example: ACTIVE
      - name: sort
        in: query
        schema:
          type: string
          example: name
      - name: currentPage
        in: query
        schema:
          type: number
          example: 1
      - name: pageSize
        in: query
        schema:
          type: number
          example: 20
      - name: createDate
        in: query
        schema:
          type: string
          example: 2023-07-28T06:01:22.684+0000
      - name: modifyDate
        in: query
        schema:
          type: string
          example: 2023-07-28T06:01:22.684+0000
      - name: x-api-key
        in: header
        description: x-api-key is an authentication or authorization token used in API requests to verify the identity and permissions of the client
        required: true
        schema:
          type: string
          example: TYQ1YzM3NWItZjQzMi00NDYwLTlmOWYtN2UwNzI5YzM2ZmV0
      responses:
        '200':
          description: Get object list with search/sort/pagination
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/com.monytyz.billing.catalog.dto.rate.RateListDto'
        '400':
          description: Bad Request
        '500':
          description: Internal server error. Please contact the support team.
  /api/rates/{rateId}:
    get:
      tags:
      - Rate
      summary: Get rate
      description: Get rate object by Id
      operationId: getRateById
      parameters:
      - name: rateId
        in: path
        required: true
        schema:
          type: string
          example: rate_1p4Z5Upb9Yh4Z
        example: rate_1p4Z5Upb9Yh4Z
      - name: x-api-key
        in: header
        description: x-api-key is an authentication or authorization token used in API requests to verify the identity and permissions of the client
        required: true
        schema:
          type: string
          example: TYQ1YzM3NWItZjQzMi00NDYwLTlmOWYtN2UwNzI5YzM2ZmV0
      responses:
        '200':
          description: Get object by id
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/com.monytyz.billing.catalog.dto.rate.RateDetailDto'
        '400':
          description: Bad Request
        '404':
          description: Resource not found by Id
        '500':
          description: Internal server error. Please contact the support team.
components:
  schemas:
    com.monytyz.billing.catalog.dto.rate.RateDetailDto:
      required:
      - id
      type: object
      properties:
        createdBy:
          type: string
          description: Identifier for the user who created the record
          example: usr_X0XZ05bvkrB1RpLS
        createDate:
          type: string
          description: Timestamp of when the record was created
          format: date-time
        lastModifiedBy:
          type: string
          description: Identifier for the user who last modified the record
          example: usr_X0XZ05bvkrB1RpLS
        modifyDate:
          type: string
          description: Timestamp of when the record was last modified
          format: date-time
        id:
          type: string
          description: Unique identifier for the rate
        customId:
          type:
          - string
          - 'null'
          description: A user provided identifier for the rate
        name:
          type: string
          description: Name of the rate. This name of the rate will appear on quotes
        description:
          type: string
          description: Description of the rate
        status:
          type: string
          description: Status of the rate. A rate can be ACTIVE, INACTIVE or CANCELED
          enum:
          - ACTIVE
          - INACTIVE
          - CANCELED
        currency:
          type: string
          description: Represents the currency of the rate. A subscription using this rate will be billed in this currency. Valid values are determined by what is configured in the tenant settings. Check yourtenat settings to see what currencies are available.
          enum:
          - AUD
          - BYN
          - CAD
          - CNY
          - DKK
          - EUR
          - GBP
          - INR
          - ISK
          - MYR
          - NOK
          - SEK
          - SGD
          - TWD
          - USD
        billingFrequency:
          type: string
          description: Represents the billing frequency of the rate. A subscription using this rate will be billed at this frequency. Valid values are MONTHLY, QUARTERLY, ANNUALLY
          enum:
          - DAILY
          - MONTHLY
          - QUARTERLY
          - SEMIANNUALLY
          - ANNUALLY
          - ONETIME
          - CUSTOM
        billingFrequencyInMonths:
          type: integer
          description: Represents the billing frequency of the rate. A subscription using this rate will be billed at this frequency. Valid values are between 1 to 60 (months)
          format: int32
        subscriptionTiming:
          type: string
          description: Defines if you want a subscription to be billed in advance or in arrears
          example: ADVANCE
          enum:
          - ADVANCE
          - ARREARS
        startDate:
          type: string
          description: A date that determines when the rate will be available for use. If this date is in the future, the rate will not be available for use until the date is reached.
          format: date
        endDate:
          type: string
          description: 'A date that determines when the rate will no longer be available for use. If this date is in the past, the rate will not be available for quoting or adding to a subscription. Note that this does not mean a subscription or quote with an end dated rate is canceled. It just means that the rate cannot be added newly to a quote or subscription '
          format: date
        accountId:
          type: string
          description: The identifier for the account that the rate is applicable to
        usageBillingFrequency:
          type: string
          description: Represents the billing frequency for Usage procucts in the offering. Currently only MONTHLY frequency is supported
          enum:
          - MONTHLY
          - QUARTERLY
          - ANNUALLY
          - SEMIANNUALLY
        locked:
          type: boolean
          description: A boolean field indicating if the rate is locked or not. A rate is locked if it is currently in use by a subscription or quote
        quotable:
          type: boolean
          description: A boolean field indicating if the rate is quotable or not. A rate is quotable if it can be added to a quote. The rate can still be used in self service flows. This flag applies to onlythe quote flow
        internalDescription:
          maxLength: 255
          minLength: 0
          type: string
          description: Internal description for the rate. This will not be displayed on quotes or invoices
        options:
          $ref: '#/components/schemas/com.monytyz.billing.catalog.dto.rate.RateOptionsDto'
        minCommitConfig:
          $ref: '#/components/schemas/com.monytyz.billing.catalog.dto.mincommit.MinCommitConfigData'
        percentOfTotalConfig:
          $ref: '#/components/schemas/com.monytyz.billing.catalog.dto.percentoftotal.PercentOfTotalConfigData'
        offering:
          $ref: '#/components/schemas/com.monytyz.billing.catalog.dto.offering.OfferingDto'
        prices:
          type: array
          description: A list of price tiers applicable to the rate
          items:
            $ref: '#/components/schemas/com.monytyz.billing.catalog.dto.price.PriceDtoV2'
        productPriceRanges:
          type: object
          additionalProperties:
            $ref: '#/components/schemas/com.monytyz.billing.catalog.dto.price.RangeDto'
        parentRateId:
          type: string
          description: If the rate is an account specific rate, this field identifies the parent rate which the account based rate is derived from
        revenueChannels:
          uniqueItems: true
          type: array
          description: Revenue channels that the rate is available to be used within
          items:
            type: string
            description: Revenue channels that the rate is available to be used within
            enum:
            - SELF_SERVICE
            - SALES
        rateType:
          type: string
          description: Type of the rate. We support 2 types of rates - CATALOG and ACCOUNT. CATALOG is global whereas ACCOUNT is specific to an account
      example:
        createdBy: usr_9oKqG1KrGADCoPmg
        createDate: 2023-05-24T17:52:10.977+0000
        lastModifiedBy: usr_9oKqG1KrGADCoPmg
        modifyDate: 2023-05-24T17:52:10.977+0000
        id: rate_1p4Z5Upb9Yh4Z
        customId: null
        name: Monthly Premium
        description: Premium plan for monthly customers
        status: ACTIVE
        currency: USD
        billingFrequency: MONTHLY
        subscriptionTiming: ADVANCE
        startDate: null
        endDate: null
        usageBillingFrequency: null
        locked: false
        quotable: true
        internalDescription: Premium plan for monthly customers
        options: null
        offering:
          createdBy: usr_Qhu8GeIXXzEueVoW
          createDate: 2023-02-24T16:01:53.077+0000
          lastModifiedBy: usr_Qhu8GeIXXzEueVoW
