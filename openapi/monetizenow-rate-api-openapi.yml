            status: ACTIVE
            productType: ADVANCE
            usageType: null
        productPriceRanges:
          prod_hQqN4qlz6ZV4R221:
            min: 0
            max: null
        parentRateId: null
        rateType: CATALOG
    com.monytyz.billing.catalog.dto.rate.ProductRateOptionsDto:
      required:
      - aggregationModel
      - productId
      type: object
      properties:
        productId:
          type: string
          description: Identifier for the Usage Product to which the rate option is associated
        aggregationModel:
          type: string
          description: Aggregation model for the usage product
          enum:
          - SUM
          - AVERAGE
    com.monytyz.billing.catalog.dto.price.PriceSaveDtoV2:
      required:
      - amount
      - from
      - priceModel
      type: object
      properties:
        productId:
          type: string
          description: The product id that this price is associated with
        from:
          minimum: 0
          type: integer
          description: The starting value of a given price tier (inclusive)
          format: int64
        to:
          minimum: 0
          type: integer
          description: The end value of a price tier (inclusive)
          format: int64
        amount:
