        required: true
        schema:
          type: string
          example: TYQ1YzM3NWItZjQzMi00NDYwLTlmOWYtN2UwNzI5YzM2ZmV0
      responses:
        '200':
          description: Activating object by id
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/com.monytyz.billing.catalog.dto.rate.RateDto'
        '400':
          description: Bad Request
        '500':
          description: Internal server error. Please contact the support team.
  /api/offerings/{offeringId}/rates/{rateId}/cancel:
    put:
      tags:
      - Rate
      summary: Cancel rate
      description: Cancel rate by providing offering Id and rate Id
      operationId: cancelRateByOfferingIdAndId
      parameters:
      - name: offeringId
        in: path
        required: true
        schema:
          type: string
          example: offer_FzQSTr9oPD1NXHcd
        example: offer_FzQSTr9oPD1NXHcd
      - name: rateId
        in: path
        required: true
        schema:
          type: string
          example: rate_1p4Z5Upb9Yh4Z
        example: rate_1p4Z5Upb9Yh4Z
      - name: x-api-key
        in: header
        description: x-api-key is an authentication or authorization token used in API requests to verify the identity and permissions of the client
        required: true
        schema:
          type: string
          example: TYQ1YzM3NWItZjQzMi00NDYwLTlmOWYtN2UwNzI5YzM2ZmV0
      responses:
        '200':
          description: Rate has been successfully canceled
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/com.monytyz.billing.common.dto.ResponseDto'
        '400':
          description: Bad Request
        '500':
          description: Internal server error. Please contact the support team.
  /api/rates:
