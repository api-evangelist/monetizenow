          type: string
          description: Name of the billgroup
          example: Demo BillGroup
        billDay:
          type: integer
          description: This is the specific day of the month on which the bill will be generated
          format: int32
          example: 5
        netTerms:
          type: string
          description: Net terms of an invoice
          example: NET_30
          enum:
          - NET_0
          - NET_5
          - NET_7
          - NET_8
          - NET_10
          - NET_14
          - NET_15
          - NET_20
          - NET_21
          - NET_30
          - NET_45
          - NET_60
          - NET_75
          - NET_90
          - NET_100
          - NET_120
          - NET_150
          - NET_180
