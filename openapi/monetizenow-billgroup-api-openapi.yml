          - $ref: '#/components/schemas/com.monytyz.billing.customer.dto.address.SourcedAddressData.Contact'
        vatNumber:
          type: string
          description: The corresponding vat number
          example: '12345678901'
        registrationNumber:
          type: string
          description: The corresponding registration number
          example: 123-45-6789
        accountingDateCalculationStrategy:
          type: string
          description: The accounting date calculation strategy
          example: BILLING_ANNIVERSARY
          enum:
          - BILLING_ANNIVERSARY
          - CLOSEST_DATE_WITHIN_INVOICING_PERIOD
          - CLOSEST_DATE_WITHIN_USAGE_PERIOD
        linkedAccountId:
          type:
          - string
          - 'null'
          description: Linked account ID for this bill group
          example: acct_linked123
        billingAccountId:
          type:
          - string
          - 'null'
          description: Billing account ID for this bill group
          example: acct_billing456
