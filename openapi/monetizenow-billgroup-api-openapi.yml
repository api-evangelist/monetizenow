          - CANCELED
          - SUSPENDED
        dunningProcessId:
          type: string
          description: Unique identifier for the dunning process
          example: '14'
        dunningStepId:
          type: string
          description: Unique identifier for the dunning step
          example: dunpr_zZMnmty165PC1dKa
        invoicingFailed:
          type: boolean
          description: A boolean field indicating that invoice failed or not
          example: true
        collectInvoiceBalanceAutomatically:
          type: boolean
          description: If you want to override the global payment configuration and prevent collection at invoice time
          example: false
        locked:
          type: boolean
        purchaseOrderNumber:
          type: string
