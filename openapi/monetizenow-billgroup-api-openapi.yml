openapi: 3.2.0
info:
  title: OpenAPI definition Bill Group API
  version: v0
  description: '# About MonetizeNow


    MonetizeNow provides a Quoting, Billing, and Usage platform built for the B2B SaaS enterprise.'
servers:
- url: https://api.monetizeplatform.com
tags:
- name: BillGroup
  description: Billgroup is an object that allows you to group subscriptions. An account can have multiple bill groups representing different departments, people or groups under the account. The bill group is where the payment method and dunning method is linked.
paths:
  /api/accounts/{accountId}/billGroups:
    get:
      tags:
      - BillGroup
      summary: Get billgroups for an account
      description: Get all of the billgroups for an account with account id
      operationId: getAllBillGroups_1
      parameters:
      - name: accountId
        in: path
        required: true
        schema:
          type: string
          example: acct_jgPH8G33rELY6LQa
        example: acct_jgPH8G33rELY6LQa
      - name: addressSource
        in: query
        schema:
          type: string
          example: ACCOUNT
      - name: billDay
        in: query
        schema:
          type: string
          example: '2022-04-07'
      - name: billingContactId
        in: query
        schema:
          type: string
          example: cntct_QEPqCDqeaVte5WzM
      - name: collectInvoiceBalanceAutomatically
        in: query
        schema:
          type: boolean
          example: true
      - name: createDate
        in: query
        schema:
          type: string
          example: '2022-04-07'
      - name: currency
        in: query
        schema:
          type: string
          example: USD
      - name: customId
        in: query
        schema:
          type: string
          example: 6b48c3f6-852e-4cd7-b4f4-a35ad60ad483
      - name: dunningProcessId
        in: query
        schema:
          type: string
          example: ACTIVE
      - name: dunningStepId
        in: query
        schema:
          type: string
          example: ACTIVE
      - name: id
        in: query
        schema:
          type: string
          example: billg_tDbC2FxuCwQoxcjm
      - name: invoiceDelay
        in: query
        schema:
          type: integer
          example: 2
      - name: invoicingFrequency
        in: query
        schema:
          type: string
          example: Monthly
      - name: invoicingFrequencyInMonths
        in: query
        schema:
          type: integer
          example: 1
      - name: legalEntityId
        in: query
        schema:
          type: string
          example: lgen_cf77b4252b0e4
      - name: locked
        in: query
        schema:
          type: boolean
          example: true
      - name: modifyDate
        in: query
        schema:
          type: string
          example: '2022-04-07'
      - name: name
        in: query
        schema:
          type: string
          example: Netflix Bill Group
      - name: netTerms
        in: query
        schema:
          type: string
          example: NET_30
      - name: nextInvoiceDate
        in: query
        schema:
          type: string
          example: '2022-04-07'
      - name: purchaseOrderNumber
        in: query
        schema:
          type: string
          example: PO 12345
      - name: registrationNumber
        in: query
        schema:
          type: string
          example: 12345
      - name: status
        in: query
        schema:
          type: string
          example: ACTIVE
      - name: sort
        in: query
        schema:
          type: string
          example: name
      - name: currentPage
        in: query
        schema:
          type: string
          example: 1
      - name: pageSize
        in: query
        schema:
          type: string
          example: 10
      - name: x-api-key
        in: header
        description: x-api-key is an authentication or authorization token used in API requests to verify the identity and permissions of the client
        required: true
        schema:
          type: string
          example: TYQ1YzM3NWItZjQzMi00NDYwLTlmOWYtN2UwNzI5YzM2ZmV0
      responses:
        '200':
          description: 'Object list retrieved '
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/com.monytyz.billing.customer.dto.billgroup.BillGroupBillGroupListDto'
        '500':
          description: Internal server error. Please contact the support team.
  /api/accounts/{accountId}/billGroups/{billGroupId}:
    get:
      tags:
      - BillGroup
      summary: Get a single billgroup
      description: Get a single billgroup information by id
      operationId: getBillGroup_1
      parameters:
      - name: accountId
        in: path
        required: true
        schema:
          type: string
          example: acct_jgPH8G33rELY6LQa
        example: acct_jgPH8G33rELY6LQa
      - name: billGroupId
        in: path
        required: true
        schema:
          type: string
          example: billg_tDbC2FxuCwQoxcjm
        example: billg_tDbC2FxuCwQoxcjm
      - name: x-api-key
        in: header
        description: x-api-key is an authentication or authorization token used in API requests to verify the identity and permissions of the client
        required: true
        schema:
          type: string
          example: TYQ1YzM3NWItZjQzMi00NDYwLTlmOWYtN2UwNzI5YzM2ZmV0
      responses:
        '200':
          description: Get bill group by account Id and billgroup Id
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/com.monytyz.billing.customer.dto.billgroup.BillGroupDetailDto'
        '400':
          description: Bad Request
        '404':
          description: Resource not found by Id
        '500':
          description: Internal server error. Please contact the support team.
    put:
      tags:
      - BillGroup
      summary: Update a billgroup
      description: Update a billgroup which holds the billing information for a quote in a specific account
      operationId: updateBillGroup
      parameters:
      - name: accountId
        in: path
        required: true
        schema:
          type: string
          example: acct_jgPH8G33rELY6LQa
        example: acct_jgPH8G33rELY6LQa
      - name: billGroupId
        in: path
        required: true
        schema:
          type: string
          example: billg_tDbC2FxuCwQoxcjm
        example: billg_tDbC2FxuCwQoxcjm
      - name: x-api-key
        in: header
        description: x-api-key is an authentication or authorization token used in API requests to verify the identity and permissions of the client
        required: true
        schema:
          type: string
          example: TYQ1YzM3NWItZjQzMi00NDYwLTlmOWYtN2UwNzI5YzM2ZmV0
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/com.monytyz.billing.customer.dto.billgroup.BillGroupSaveDto'
        required: true
      responses:
        '200':
          description: Update object by id
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/com.monytyz.billing.customer.dto.billgroup.BillGroupDetailDto'
        '400':
          description: Bad Request
        '500':
          description: Internal server error. Please contact the support team.
  /api/accounts/{accountId}/billGroups/{billGroupId}/activate:
    put:
      tags:
      - BillGroup
      summary: Activate a billgroup
      operationId: activateBillGroup
      parameters:
      - name: accountId
        in: path
        required: true
        schema:
          type: string
          example: acct_jgPH8G33rELY6LQa
        example: acct_jgPH8G33rELY6LQa
      - name: billGroupId
        in: path
        required: true
        schema:
          type: string
          example: billg_tDbC2FxuCwQoxcjm
        example: billg_tDbC2FxuCwQoxcjm
      - name: x-api-key
        in: header
        description: x-api-key is an authentication or authorization token used in API requests to verify the identity and permissions of the client
        required: true
        schema:
          type: string
          example: TYQ1YzM3NWItZjQzMi00NDYwLTlmOWYtN2UwNzI5YzM2ZmV0
      responses:
        '200':
          description: Activate bill group
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/com.monytyz.billing.customer.dto.billgroup.BillGroupDetailDto'
        '400':
          description: Bad Request
        '500':
          description: Internal server error. Please contact the support team.
  /api/accounts/{accountId}/billGroups/{billGroupId}/deactivate:
    put:
      tags:
      - BillGroup
      summary: Deactivate a billgroup
      operationId: deactivateBillGroup
      parameters:
      - name: accountId
        in: path
        required: true
        schema:
          type: string
          example: acct_jgPH8G33rELY6LQa
        example: acct_jgPH8G33rELY6LQa
      - name: billGroupId
        in: path
        required: true
        schema:
          type: string
          example: billg_tDbC2FxuCwQoxcjm
        example: billg_tDbC2FxuCwQoxcjm
      - name: x-api-key
        in: header
        description: x-api-key is an authentication or authorization token used in API requests to verify the identity and permissions of the client
        required: true
        schema:
          type: string
          example: TYQ1YzM3NWItZjQzMi00NDYwLTlmOWYtN2UwNzI5YzM2ZmV0
      responses:
        '200':
          description: Deactivate bill group
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/com.monytyz.billing.customer.dto.billgroup.BillGroupDetailDto'
        '400':
          description: Bad Request
        '500':
          description: Internal server error. Please contact the support team.
  /api/billGroups/{billGroupId}:
    get:
      tags:
      - BillGroup
      summary: Get a single billgroup
      description: Get a single billgroup information by id
      operationId: getBillGroup
      parameters:
      - name: billGroupId
        in: path
        required: true
        schema:
          type: string
          example: billg_tDbC2FxuCwQoxcjm
        example: billg_tDbC2FxuCwQoxcjm
      - name: x-api-key
        in: header
        description: x-api-key is an authentication or authorization token used in API requests to verify the identity and permissions of the client
        required: true
        schema:
          type: string
          example: TYQ1YzM3NWItZjQzMi00NDYwLTlmOWYtN2UwNzI5YzM2ZmV0
      responses:
        '200':
          description: 'get BillGroup by accountId and billGroupId '
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/com.monytyz.billing.customer.dto.billgroup.BillGroupDetailDto'
        '400':
          description: Bad Request
        '404':
          description: Resource not found by Id
        '500':
          description: Internal server error. Please contact the support team.
components:
  schemas:
    com.monytyz.billing.customer.dto.contact.ContactDto:
      type: object
      properties:
        createdBy:
          type: string
          description: Identifier for the user who created the record
          example: usr_X0XZ05bvkrB1RpLS
        createDate:
          type: string
          description: Timestamp of when the record was created
          format: date-time
        lastModifiedBy:
          type: string
          description: Identifier for the user who last modified the record
          example: usr_X0XZ05bvkrB1RpLS
        modifyDate:
          type: string
          description: Timestamp of when the record was last modified
          format: date-time
        id:
          type: string
          description: A unique identifier for the contact
          example: cntct_8P9ijCslTprCI7Wu
        customId:
          type: string
          description: A user provided identifier for the contact
          example: c993f52b-0bbd-454b-9849-fd6c1991efb6
        accountId:
          type: string
          description: Account ID where the contact belongs
          example: acct_m0CB9LflojZxytfC
        address:
          $ref: '#/components/schemas/com.monytyz.billing.customer.dto.address.AddressDto'
        status:
          type: string
          description: Status of the contact. Status can be ACTIVE, CANCELED or ARCHIVED
          example: ACTIVE
          enum:
          - ACTIVE
          - CANCELED
          - ARCHIVED
        fullName:
          type: string
          description: Full name of the contact
          example: Bob Smith
        email:
          type: string
          description: Email of the contact
          example: contact@example.com
        phone:
          type: string
          description: Phone of the contact
          example: +1 800 444 4444
        title:
          type: string
          description: Title of the contact
          example: CFO
        internal:
          type: boolean
          description: Boolean value indicating if the contact is internal or external which is used for e-Signing
          example: false
        primary:
          type: boolean
          description: Boolean value indicating if the contact is primary or not
          example: true
        defaultESigner:
          type: boolean
          description: Boolean value indicating if the contact is default eSigner
          example: false
        customFields:
          type: object
          additionalProperties:
            type: object
            description: User configured custom fields for the contact
          description: User configured custom fields for the contact
        esigner:
          type: boolean
      description: Primary contact information for this account
    com.monytyz.billing.customer.dto.billgroup.BillGroupSaveDto:
      required:
      - billDay
      - name
      - netTerms
      - status
      type: object
      properties:
        paymentMethodId:
          type:
          - string
          - 'null'
          description: Unique identifier for the billgroup payment method
          example: pmtmd_vFQZjKnb7mUpDYud
        defaultPaymentGatewayId:
          type:
          - string
          - 'null'
          description: Unique identifier for the payment gateway. If found empty, BE will set the default one.
          example: pmtgw_EMfbqn56S9h9CweL
        contactId:
          type: string
          description: Unique identifier for the billgroup billing contact
          example: ctrct_QEPqCDqeaVte5WzM
        shippingContactId:
          type: string
          description: Unique identifier for the BillGroup's shipping contact
          example: ctrct_QEPqCDqeaVte5WzM
        customId:
          type:
          - string
          - 'null'
          description: A user provided identifier for the billgroup
          example: 6b48c3f6-852e-4cd7-b4f4-a35ad60ad483
        name:
          type: string
          description: Name of the billgroup
          example: Demo BillGroup
        billDay:
          type: integer
          description: This is the specific day of the month on which the bill will be generated
          format: int32
          example: 5
        netTerms:
          type: string
          description: Net terms of an invoice
          example: NET_30
          enum:
          - NET_0
          - NET_5
          - NET_7
          - NET_8
          - NET_10
          - NET_14
          - NET_15
          - NET_20
          - NET_21
          - NET_30
          - NET_45
          - NET_60
          - NET_75
          - NET_90
          - NET_100
          - NET_120
          - NET_150
          - NET_180
        status:
          type: string
          description: Billgroup status like ACTIVE, INACTIVE, CANCELED OR SUSPENDED
          example: ACTIVE
          enum:
          - ACTIVE
          - INACTIVE
          - CANCELED
          - SUSPENDED
        dunningProcessId:
          type:
          - string
          - 'null'
          description: Unique identifier for the dunning process
          example: dunpr_QEPqCDqeaVte5WzM
        collectInvoiceBalanceAutomatically:
          type: boolean
          description: If you want to override the global payment configuration and prevent collection at invoice time
          example: false
        autoEmailInvoice:
          type: boolean
          description: Automatically send invoice by email if true
          example: false
        invoiceCreation:
          type: string
          description: The invoice creation type like AUTOMATIC or MANUAL
          example: AUTOMATIC
          enum:
          - AUTOMATIC
          - MANUAL
        invoiceDelay:
          type: integer
          description: Delay associated with invoice creation with minimum zero and maximum two days
          format: int32
          example: 0
        firstInvoiceCreationStrategy:
          type: string
          description: First invoice creation strategy when invoice is being created manually
          example: GENERATE_ON_QUOTE_PROCESSED
          enum:
          - FOLLOW_EXISTING_SETTINGS
          - GENERATE_ON_QUOTE_PROCESSED
        ccEmails:
          uniqueItems: true
          type: array
          description: A list of email addresses to which the invoice will be copied
          example: '[''abc@gmail.com'', ''def@gmail.com'']'
          items:
            type: string
            description: A list of email addresses to which the invoice will be copied
            example: '[''abc@gmail.com'', ''def@gmail.com'']'
        purchaseOrderNumber:
          type: string
          description: The corresponding purchase order number
          example: PO-123
        legalEntityId:
          type: string
          description: Unique identifier for the legal entity. Account's legal entity will be linked if no legal entity is specified
          example: lgen_e33f05749111f
        currency:
          type: string
          description: Currency for the BillGroup. It is the ISO 4217 assigned three-digit code. If no currency is provided, the account's default currency will be set
          example: USD
          enum:
          - AUD
          - BYN
          - CAD
          - CNY
          - DKK
          - EUR
          - GBP
          - INR
          - ISK
          - MYR
          - NOK
          - SEK
          - SGD
          - TWD
          - USD
        customFields:
          type: object
          additionalProperties:
            type: object
        addressData:
          oneOf:
          - $ref: '#/components/schemas/com.monytyz.billing.customer.dto.address.SourcedAddressData.Account'
          - $ref: '#/components/schemas/com.monytyz.billing.customer.dto.address.SourcedAddressData.Contact'
        vatNumber:
          type: string
          description: The corresponding vat number
          example: '12345678901'
        registrationNumber:
          type: string
          description: The corresponding registration number
          example: 123-45-6789
        accountingDateCalculationStrategy:
          type: string
          description: The accounting date calculation strategy
          example: BILLING_ANNIVERSARY
          enum:
          - BILLING_ANNIVERSARY
          - CLOSEST_DATE_WITHIN_INVOICING_PERIOD
          - CLOSEST_DATE_WITHIN_USAGE_PERIOD
        linkedAccountId:
          type:
          - string
          - 'null'
          description: Linked account ID for this bill group
          example: acct_linked123
        billingAccountId:
          type:
          - string
          - 'null'
          description: Billing account ID for this bill group
          example: acct_billing456
      example: "\n            {\n                \"name\": \"Demo BillGroup\",\n                \"contactId\": \"cont_KmKel632AmnUp\",\n                \"defaultPaymentGatewayId\": \"pmgw_MkAi8Eno4mXta\",\n                \"paymentMethodId\": \"pmtmd_vFQZjKnb7mUpDYud\",\n                \"dunningProcessId\": \"dunpr_QEPqCDqeaVte5WzM,\n                \"billDay\": 1,\n                \"status\": \"ACTIVE\",\n                \"collectInvoiceBalanceAutomatically\": true,\n                \"customId\": \"6b48c3f6-852e-4cd7-b4f4-a35ad60ad483\",\n                \"netTerms\": \"NET_30\",\n                \"autoEmailInvoice\": true,\n                \"invoiceCreation\": \"AUTOMATIC\",\n                \"invoiceDelay\": 0\n            }\n            "
    com.monytyz.billing.customer.dto.billgroup.BillGroupDetailDto:
      type: object
      properties:
        createdBy:
          type: string
          description: Identifier for the user who created the record
          example: usr_X0XZ05bvkrB1RpLS
        createDate:
          type: string
          description: Timestamp of when the record was created
          format: date-time
        lastModifiedBy:
          type: string
          description: Identifier for the user who last modified the record
