          - SEK
          - SGD
          - TWD
          - USD
        customFields:
          type: object
          additionalProperties:
            type: object
            description: User configured custom fields for the bill group
          description: User configured custom fields for the bill group
        errorStatus:
          type: string
          description: BillGroup status shows if there’s an error. It can be 'NONE' or 'TAX_CALCULATION_ERROR'.
          enum:
          - NONE
