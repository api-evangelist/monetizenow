          example: usr_X0XZ05bvkrB1RpLS
        createDate:
          type: string
          description: Timestamp of when the record was created
          format: date-time
        lastModifiedBy:
          type: string
          description: Identifier for the user who last modified the record
          example: usr_X0XZ05bvkrB1RpLS
        modifyDate:
          type: string
          description: Timestamp of when the record was last modified
          format: date-time
        id:
          type: string
          description: Unique identifier for the billgroup
          example: billg_tDbC2FxuCwQoxcjm
        accountId:
          type: string
          description: Unique identifier for the billgroup account
          example: acct_m0CB9LflojZxytfC
        account:
          $ref: '#/components/schemas/com.monytyz.billing.customer.dto.account.AccountDto'
        contractId:
          type: string
          description: Unique identifier for the bill group's active contract
          example: cntct_ItU2G9ZEkUvyBX9q
        activeContract:
          type: boolean
          description: A boolean field indicating whether the bill group has active contract
          example: true
        paymentMethodId:
          type: string
          description: Unique identifier for the billgroup payment method
          example: pmtmd_vFQZjKnb7mUpDYud
        billingContactId:
          type: string
          description: Unique identifier for the billgroup billing contact
          example: cntct_E9jLE3Rz3VTGfDuM
        billingContact:
          $ref: '#/components/schemas/com.monytyz.billing.customer.dto.billgroup.BillGroupContactDto'
        shippingContactId:
          type: string
          description: Unique identifier for the BillGroup's shipping contact
          example: cntct_E9jLE3Rz3VTGfDuM
        shippingContact:
          $ref: '#/components/schemas/com.monytyz.billing.customer.dto.billgroup.BillGroupContactDto'
        customId:
          type: string
          description: A user provided identifier for the billgroup
          example: c993f52b-0bbd-454b-9849-fd6c1991efb6
        name:
          type: string
          description: Name of the billgroup
          example: Default
        billDay:
          type: integer
