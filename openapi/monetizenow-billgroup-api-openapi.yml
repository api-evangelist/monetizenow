          type: boolean
          description: Automatically send invoice by email if true
          example: false
        invoiceCreation:
          type: string
          description: The invoice creation type like AUTOMATIC or MANUAL
          example: AUTOMATIC
          enum:
          - AUTOMATIC
          - MANUAL
