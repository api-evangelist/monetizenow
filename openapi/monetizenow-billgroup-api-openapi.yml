          example: GENERATE_ON_QUOTE_PROCESSED
          enum:
          - FOLLOW_EXISTING_SETTINGS
          - GENERATE_ON_QUOTE_PROCESSED
        ccEmails:
          uniqueItems: true
          type: array
          description: A list of email addresses to which the invoice will be copied
          example: '[''abc@gmail.com'', ''def@gmail.com'']'
          items:
            type: string
            description: A list of email addresses to which the invoice will be copied
            example: '[''abc@gmail.com'', ''def@gmail.com'']'
        purchaseOrderNumber:
          type: string
          description: The corresponding purchase order number
          example: PO-123
        legalEntityId:
          type: string
