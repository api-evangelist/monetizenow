      required:
      - city
      - country
      - description
      - line1
      - line2
      - postalCode
      - state
      - type
      type: object
      properties:
        type:
          $ref: '#/components/schemas/com.monytyz.billing.customer.dto.address.AddressType'
        line1:
          type: string
        line2:
          type: string
        city:
          type: string
        state:
          type: string
        postalCode:
          type: string
        country:
          type: string
        description:
          type: string
    com.monytyz.billing.invoice.model.InvoiceCreditCompositeId:
      type: object
    com.monytyz.billing.subscription.model.SubscriptionItem:
      type: object
      properties:
        createdBy:
          type: string
        createDate:
          type: string
          format: date-time
        lastModifiedBy:
          type: string
        modifyDate:
          type: string
          format: date-time
        id:
          type: string
        subscription:
          $ref: '#/components/schemas/com.monytyz.billing.subscription.model.Subscription'
        product:
          $ref: '#/components/schemas/com.monytyz.billing.catalog.model.Product'
        description:
          type: string
        units:
          type: number
          format: double
        charges:
          uniqueItems: true
          type: array
          items:
            $ref: '#/components/schemas/com.monytyz.billing.charge.model.Charge'
        applicableItemDiscounts:
          uniqueItems: true
          type: array
          items:
            $ref: '#/components/schemas/com.monytyz.billing.subscription.model.SubscriptionItemDiscount'
        customPrice:
          $ref: '#/components/schemas/com.monytyz.billing.catalog.model.CustomPrice'
        quoteItemId:
          type: string
        active:
          type: boolean
    com.monytyz.billing.customer.model.Contact:
      required:
      - customFields
      type: object
      properties:
        createdBy:
          type: string
        createDate:
          type: string
          format: date-time
        lastModifiedBy:
          type: string
        modifyDate:
          type: string
          format: date-time
        id:
          type: string
        customId:
          type: string
        address:
          $ref: '#/components/schemas/com.monytyz.billing.customer.model.Address'
        status:
          type: string
          enum:
          - ACTIVE
          - CANCELED
          - ARCHIVED
        fullName:
          type: string
        email:
          type: string
        phone:
          type: string
        title:
          type: string
        internal:
          type: boolean
        primary:
          type: boolean
        defaultESigner:
          type: boolean
        customFields:
          type: object
          additionalProperties:
            type: object
        esigner:
          type: boolean
      description: the billing contact for the order.
    com.monytyz.billing.customer.model.BillGroup:
      required:
      - netTerms
      type: object
      properties:
        createdBy:
          type: string
        createDate:
          type: string
          format: date-time
        lastModifiedBy:
          type: string
        modifyDate:
          type: string
          format: date-time
        id:
          type: string
        contracts:
          uniqueItems: true
          type: array
          items:
            $ref: '#/components/schemas/com.monytyz.billing.contract.model.Contract'
        paymentMethod:
          $ref: '#/components/schemas/com.monytyz.billing.payment.model.PaymentMethod'
        billingContact:
          $ref: '#/components/schemas/com.monytyz.billing.customer.model.Contact'
        shippingContact:
          $ref: '#/components/schemas/com.monytyz.billing.customer.model.Contact'
        name:
          type: string
        customId:
          type: string
        billDay:
          type: integer
          format: int32
        netTerms:
          type: string
          description: Default Net terms for this bill group
          enum:
          - NET_0
          - NET_5
          - NET_7
          - NET_8
          - NET_10
          - NET_14
          - NET_15
          - NET_20
          - NET_21
          - NET_30
          - NET_45
          - NET_60
          - NET_75
          - NET_90
          - NET_100
          - NET_120
          - NET_150
          - NET_180
        invoicingFrequency:
          type: string
          enum:
          - DAILY
          - MONTHLY
          - QUARTERLY
          - SEMIANNUALLY
          - ANNUALLY
          - CUSTOM
        invoicingFrequencyInMonths:
          type: integer
          format: int32
        nextInvoiceDate:
          type: string
          format: date
        previousInvoiceDate:
          type: string
