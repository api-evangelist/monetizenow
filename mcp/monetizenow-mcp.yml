description: >-
  MonetizeNow operates a REAL, first-party, hosted remote MCP server at
  https://mcp.monetizeplatform.com/mcp. It is not advertised anywhere in the
  public documentation, the marketing site, or any MCP registry — it was found by
  probing the platform domain. Ownership is not in doubt:
  mcp.monetizeplatform.com is a subdomain of the same monetizeplatform.com domain
  that carries the documented REST base (api.monetizeplatform.com), the console
  (app.monetizeplatform.com) and the status page (status.monetizeplatform.com),
  and it resolves through prod-eks-alb.monetizeplatform.com to MonetizeNow's own
  production EKS load balancer.
  The server is OAuth-protected and answers every unauthenticated request with
  HTTP 401, `WWW-Authenticate: Bearer realm="mcp"` and
  {"error":"missing_token"}. It publishes complete RFC 9728 protected-resource
  metadata and RFC 8414 authorization-server metadata, including a dynamic client
  registration endpoint and PKCE S256 — the correct modern MCP authorization
  posture. Because authorization is required, `tools/list` could not be called and
  the REAL tool set and inputSchemas are UNKNOWN. Nothing below is presented as the
  server's actual tool list.
