name: MonetizeNow
description: >-
  MonetizeNow is an enterprise monetization platform that unifies quoting,
  billing, and usage metering into a single quote-to-cash system for B2B SaaS
  companies. It combines a CPQ/quote builder with guided selling, a billing
  engine supporting subscriptions, credits, and usage-based pricing,
  multi-currency payments (via Stripe), dunning, revenue recognition, and
  real-time usage metering handling billions of daily events. The platform
  exposes a REST API (base https://api.monetizeplatform.com) authenticated with
  an x-api-key header, covering accounts, contacts, quotes, opportunities,
  contracts, subscriptions, invoices, payments, credits, credit notes,
  products, offerings, rates, usage events, trials, and a self-service checkout
  flow, plus a rich webhook event surface for quotes, invoices, subscriptions,
  and payments. Pre-built connectors integrate Salesforce, HubSpot, Attio,
  NetSuite, QuickBooks, Xero, DocuSign, Adobe Sign, Anrok, Avalara, and
  Taxwire. MonetizeNow is backed by Uncork Capital.
