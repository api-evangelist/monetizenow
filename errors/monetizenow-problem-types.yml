source: >-
  openapi/monetizenow-openapi.json (derived from the 4xx/5xx responses of all 156
  published operations), enriched from the error table in the spec's own
  info.description and from
  https://docs.monetizenow.io/reference/checkout.
format: http-status
description: >-
  API-level error responses for the MonetizeNow REST API. MonetizeNow does NOT
  use RFC 9457 problem+json — there is no application/problem+json media type
  anywhere in the published spec, no `type` URI, and no stable machine-readable
  error identifier on the main REST surface. Errors are ordinary HTTP statuses
  with a free-text `message`. Two error envelopes exist side by side, plus a
  third string-enum error-code scheme that appears only on the self-service
  checkout API.
envelope:
  media_type: application/json
  rfc9457: false
  primary:
    schema: com.monytyz.billing.common.dto.ResponseDto
    shape: '{ status: integer(int32), message: string }'
    used_on: 400, 404, 500
  secondary:
    schema: ResponseDto
    shape: '{ status: string enum of "400 BAD_REQUEST" style labels, ... }'
    note: >-
      A second, incompatible ResponseDto in which `status` is a STRING label
      ("400 BAD_REQUEST") rather than an integer. Two different shapes named
      ResponseDto are served by the same API; a generated client will collide on
      the name and a consumer cannot rely on the type of `status`.
  untyped:
    note: >-
      The majority of error responses declare `schema: {type: object}` with no
      properties at all, so the body shape is undefined in the contract.
