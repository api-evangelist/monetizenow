self_service_error_codes:
  api: POST /api/selfService/checkout (provisionContract)
  docs: https://docs.monetizenow.io/reference/checkout
  format: string enum in the response body
  note: >-
    The self-service checkout API is the only MonetizeNow surface with stable,
    machine-readable error identifiers. It is also the only surface documented
    with TypeScript types rather than OpenAPI.
  codes:
  - {code: INVALID_ACCOUNT, meaning: Account ID nonexistent}
  - {code: EMPTY_OFFERINGS, meaning: Request contains no offerings}
  - {code: INVALID_OFFERINGS, meaning: Request contains nonexistent offerings}
  - {code: INVALID_RATES, meaning: Request contains nonexistent rates}
  - {code: ACCOUNT_RATE_MISMATCH, meaning: Specified rates belong to other accounts}
  - {code: INVALID_CONTRACT_END_DATE, meaning: Specified end date of contract is greater than the start date}
  - {code: PRICE_OFFERINGS_FAILED, meaning: Pricing of offerings failed due to validation error(s)}
partial_success:
  api: POST /events (recordEvents)
  schema: EventResponse
  shape: '{ status: SUCCESS | PARTIAL | FAILED, failedEvents: [FailedEvent] }'
  note: >-
    Usage ingestion is the one batch surface: a 2xx can still carry per-event
    failures, so a consumer must inspect `status` and `failedEvents` rather than
    trusting the status code.
notes:
- >-
  RECOMMENDATION TO THE PROVIDER: adopt RFC 9457 application/problem+json with a
  stable `type` URI per error, document the 401, and reconcile the two conflicting
  ResponseDto schemas.
